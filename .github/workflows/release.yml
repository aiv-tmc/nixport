name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: experimental-features = nix-command flakes
      - name: The tag must match the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          test "v$version" = "${GITHUB_REF_NAME}"
      - name: Verify
        run: |
          nix develop -c cargo test
          nix build .#nixport -L
      - name: Source archive
        run: git archive --format=tar.gz --prefix="nixport-${GITHUB_REF_NAME}/" -o "nixport-${GITHUB_REF_NAME}.tar.gz" HEAD
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "nixport-${GITHUB_REF_NAME}.tar.gz" --generate-notes
